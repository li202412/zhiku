name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # pyproject 默认走清华源（本地更快），CI 上走官方源更稳
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: backend
        # 跳过 parsers 组（unstructured[all-docs] 含 torch，数 GB），测试不依赖它
        run: uv sync --frozen --extra dev --no-group parsers
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Test
        working-directory: backend
        run: uv run pytest -q --basetemp=.pytest_basetemp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
      - name: Lint (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        # backend/.env 被 .gitignore 忽略，干净检出时不存在；先按示例生成一份再做配置校验
        run: cp backend/.env.example backend/.env
      - name: Validate compose file
        run: docker compose config -q
